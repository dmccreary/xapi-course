# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'xAPI for Intelligent Textbooks'
site_description: 'An interactive intelligent textbook for software professionals implementing the xAPI standard in Level 3 intelligent textbooks, covering LRS architecture, bandwidth optimization, traffic monitoring, and the broader educational standards ecosystem.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/xapi-course/'

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/xapi-course'
edit_uri: 'blob/main/docs'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Foundations and Standards: chapters/01-foundations-and-standards/index.md
      - 2. Statement Model: chapters/02-statement-model/index.md
      - 3. Advanced Statement Structure: chapters/03-advanced-statement-structure/index.md
      - 4. Verb Vocabulary Design: chapters/04-verb-vocabulary-design/index.md
      - 5. Activities, Agents, Identity: chapters/05-activities-agents-identity/index.md
      - 6. LRS Architecture: chapters/06-lrs-architecture/index.md
      - 7. LRS Platforms and Auth: chapters/07-lrs-platforms-and-auth/index.md
      - 8. Implementing in Textbooks: chapters/08-implementing-in-textbooks/index.md
      - 9. Bandwidth and Offline: chapters/09-bandwidth-and-offline/index.md
      - 10. Monitoring and Observability: chapters/10-monitoring-and-observability/index.md
      - 11. Synthetic Data and AI Testing: chapters/11-synthetic-data-and-ai-testing/index.md
      - 12. Conformance and Comparison: chapters/12-conformance-and-comparison/index.md
      - 13. Pipeline and Production: chapters/13-pipeline-and-production/index.md
      - 14. Privacy and Compliance: chapters/14-privacy-and-compliance/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Mascot Style Guide: learning-graph/mascot-test.md
      # Generated by learning-graph-generator skill:
      # - Concept Enumeration: learning-graph/concept-list.md
      # - Concept Taxonomy: learning-graph/concept-taxonomy.md
      # - Graph Quality Analysis: learning-graph/quality-metrics.md
      # - Taxonomy Distribution: learning-graph/taxonomy-distribution.md

  - MicroSims:
    - List of MicroSims: sims/index.md
    - Learning Graph Viewer: sims/graph-viewer/index.md
    - The xAPI Statement Triple — Actor / Verb / Object: sims/xapi-statement-triple/index.md



  - Glossary: glossary.md
  - References: references.md
  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  logo: img/mascot/neutral.png
  favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'xAPI for Intelligent Textbooks'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
