<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Bandwidth Budget Calculator MicroSim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #212529;
            font-size: 13px;
            overflow: hidden;
        }
        .title {
            height: 36px;
            line-height: 36px;
            padding: 0 14px;
            background: #1e293b;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .layout {
            display: flex;
            width: 100%;
            height: calc(100vh - 36px);
        }
        .controls {
            flex: 2;
            padding: 12px 16px;
            background: #fff;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
        }
        .panel {
            flex: 1;
            padding: 12px 14px;
            background: #f1f5f9;
            overflow-y: auto;
        }
        .slider-row {
            margin-bottom: 8px;
        }
        .slider-row label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 2px;
            color: #334155;
        }
        .slider-row label .val {
            font-weight: bold;
            color: #4338ca;
            font-variant-numeric: tabular-nums;
        }
        .slider-row input[type=range] {
            width: 100%;
        }
        .presets {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #cbd5e1;
        }
        .presets-label {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .preset-btn {
            display: inline-block;
            margin: 0 4px 4px 0;
            padding: 4px 9px;
            font-size: 11px;
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            color: #334155;
        }
        .preset-btn:hover { background: #e2e8f0; }
        .panel h3 {
            font-size: 13px;
            color: #1e293b;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid #4338ca;
        }
        .out-row {
            margin-bottom: 7px;
            font-size: 12px;
        }
        .out-row .lbl { color: #64748b; display: block; font-size: 11px; }
        .out-row .v { font-size: 16px; font-weight: bold; color: #1e293b; font-variant-numeric: tabular-nums; }
        .ref-select {
            width: 100%;
            padding: 4px;
            margin: 6px 0;
            font-size: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .bar-bg {
            width: 100%;
            height: 18px;
            background: #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            background: #4338ca;
            transition: width 0.2s, background 0.2s;
        }
        .bar-pct {
            position: absolute;
            left: 6px; top: 0;
            line-height: 18px;
            font-size: 11px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0,0,0,0.4);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
        }
        .badge.green { background: #16a34a; }
        .badge.yellow { background: #ca8a04; }
        .badge.red { background: #dc2626; }
    </style>
    <script src="bandwidth-budget-calculator-microsim.js" defer></script>
</head>
<body>
    <div class="title">Bandwidth Budget Calculator — adjust sliders to model xAPI traffic</div>
    <div class="layout">
        <div class="controls">
            <div class="slider-row">
                <label>Per-statement payload (bytes) <span class="val" id="v-payload">1200</span></label>
                <input type="range" id="payload" min="500" max="3000" value="1200" step="50">
            </div>
            <div class="slider-row">
                <label>HTTP overhead per request (bytes) <span class="val" id="v-overhead">700</span></label>
                <input type="range" id="overhead" min="300" max="1500" value="700" step="25">
            </div>
            <div class="slider-row">
                <label>Statements per learner per session <span class="val" id="v-statements">45</span></label>
                <input type="range" id="statements" min="5" max="200" value="45" step="1">
            </div>
            <div class="slider-row">
                <label>Session duration (minutes) <span class="val" id="v-duration">20</span></label>
                <input type="range" id="duration" min="5" max="120" value="20" step="1">
            </div>
            <div class="slider-row">
                <label>Concurrent learners <span class="val" id="v-learners">30</span></label>
                <input type="range" id="learners" min="1" max="1000" value="30" step="1">
            </div>
            <div class="slider-row">
                <label>Batch size (statements per POST) <span class="val" id="v-batch">1</span></label>
                <input type="range" id="batch" min="1" max="50" value="1" step="1">
            </div>
            <div class="presets">
                <div class="presets-label">Presets</div>
                <button class="preset-btn" data-preset="reading">Reading-only chapter</button>
                <button class="preset-btn" data-preset="math">Interactive math chapter</button>
                <button class="preset-btn" data-preset="physics">Simulation-heavy physics chapter</button>
                <button class="preset-btn" data-preset="assessment">30-student assessment window</button>
            </div>
        </div>
        <div class="panel">
            <h3>Live Output</h3>
            <div class="out-row">
                <span class="lbl">Bytes per learner-session</span>
                <span class="v" id="o-perlearner">—</span>
            </div>
            <div class="out-row">
                <span class="lbl">Total bytes for cohort</span>
                <span class="v" id="o-cohort">—</span>
            </div>
            <div class="out-row">
                <span class="lbl">Average bytes/sec during session</span>
                <span class="v" id="o-bps">—</span>
            </div>
            <div class="out-row">
                <span class="lbl">Compare against reference link</span>
                <select class="ref-select" id="ref">
                    <option value="ruralCell">.1 Mbps Rural Cell</option>
                    <option value="sat">1 Mbps Satellite</option>
                    <option value="wifi">5 Mbps Classroom Wi-Fi</option>
                    <option value="cell">10 Mbps 5G Cellular Tether</option>
                    <option value="campus">1 Gbps Campus Fiber</option>
                </select>
                <div class="bar-bg">
                    <div class="bar-fill" id="bar"></div>
                    <div class="bar-pct" id="bar-pct"></div>
                </div>
                <span class="badge green" id="badge">OK</span>
            </div>
        </div>
    </div>
</body>
</html>
