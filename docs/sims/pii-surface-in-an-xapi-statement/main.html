<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>PII Surface in an xAPI Statement</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; background: #f8fafc;
            font-size: 13px; color: #1e293b; }
        .title { height: 36px; line-height: 36px; padding: 0 14px;
            background: #1e293b; color: #fff; font-size: 14px; font-weight: bold; }
        .toolbar { display: flex; gap: 8px; padding: 8px 14px;
            background: #fff; border-bottom: 1px solid #e2e8f0;
            font-size: 12px; align-items: center; }
        .toolbar button {
            padding: 4px 10px; font-size: 11px;
            border: 1px solid #cbd5e1; background: #fff; border-radius: 4px;
            cursor: pointer; }
        .toolbar button.active { background: #4338ca; color: #fff;
            border-color: #4338ca; }
        .container { display: flex; width: 100%;
            height: calc(100% - 36px - 38px); }
        .json-panel { width: 60%; height: 100%; padding: 12px;
            background: #f8fafc; overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace; font-size: 12px;
            line-height: 1.5; }
        .info-panel { flex: 1; height: 100%; background: #fff;
            border-left: 1px solid #e2e8f0; padding: 14px; overflow-y: auto; }
        .info-panel h3 { font-size: 13px; color: #1e293b;
            margin-bottom: 8px; padding-bottom: 4px;
            border-bottom: 2px solid #4338ca; }
        .info-title { font-size: 13px; font-weight: bold;
            margin-bottom: 6px; }
        .info-content { font-size: 12px; line-height: 1.5; color: #334155; }
        .info-content p { margin-bottom: 6px; }
        .info-content code { background: #f1f5f9; padding: 1px 4px;
            border-radius: 3px; font-size: 11px; color: #be185d;
            font-family: 'Consolas', monospace; }
        .info-placeholder { color: #94a3b8; font-style: italic; font-size: 12px; }
        .risk-tag { display: inline-block; padding: 2px 8px;
            border-radius: 10px; font-size: 11px; font-weight: bold;
            color: #fff; margin-bottom: 8px; }
        .meta-row { display: flex; gap: 8px; margin-bottom: 6px;
            font-size: 11px; }
        .meta-row .lbl { color: #64748b; min-width: 80px; }
        .meta-row .val { color: #1e293b; font-weight: 500; }
        .json-line { white-space: pre; }
        .region {
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 3px;
            transition: filter 0.15s;
        }
        .region:hover { filter: brightness(0.96); }
        .region.actor { background: rgba(220, 38, 38, 0.12);
            border-left: 3px solid #dc2626;
            display: block;
            padding-left: 6px;
            margin: 2px 0; }
        .region.result-ext { background: rgba(202, 138, 4, 0.12);
            border-left: 3px solid #ca8a04;
            display: block;
            padding-left: 6px;
            margin: 2px 0; }
        .region.context-ext { background: rgba(202, 138, 4, 0.12);
            border-left: 3px solid #ca8a04;
            display: block;
            padding-left: 6px;
            margin: 2px 0; }
        .region.selected { outline: 2px solid #4338ca; }
        .key { color: #be185d; }
        .str { color: #16a34a; }
        .num { color: #0d9488; }
        .punc { color: #64748b; }
    </style>
    <script src="pii-surface-in-an-xapi-statement.js" defer></script>
</head>
<body>
    <div class="title">PII surface in an xAPI statement — click a shaded region for risks and mitigations</div>
    <div class="toolbar">
        <span>View:</span>
        <button data-view="default" class="active">Default</button>
        <button data-view="clean">Clean version</button>
        <button data-view="worst">Worst-case version</button>
    </div>
    <div class="container">
        <div class="json-panel" id="json-panel"></div>
        <div class="info-panel">
            <h3>Region Details</h3>
            <div id="info-display">
                <p class="info-placeholder">Click any shaded region in the JSON to see PII risks, mitigations, and which regulations apply.</p>
            </div>
        </div>
    </div>
</body>
</html>
