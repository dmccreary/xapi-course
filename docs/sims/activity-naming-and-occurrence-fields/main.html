<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Activity Naming and Occurrence Fields</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: Arial, Helvetica, sans-serif; background: #f8fafc;
            color: #1e293b;
        }
        .title {
            height: 40px; line-height: 40px; padding: 0 14px;
            background: #1e293b; color: #fff; font-size: 14px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .toggle-wrap {
            font-size: 12px; font-weight: normal; color: #e2e8f0;
            display: flex; align-items: center; gap: 6px;
        }
        .toggle-wrap input { cursor: pointer; }
        .toggle-wrap label { cursor: pointer; user-select: none; }

        .container {
            display: flex; width: 100%; height: calc(100% - 40px);
        }
        .json-panel {
            width: 66%; background: #f1f5f9;
            padding: 12px; overflow: auto;
            border-right: 1px solid #cbd5e1;
        }
        .json-block {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            color: #0f172a;
            white-space: pre;
        }
        .json-key { color: #be185d; }
        .json-string { color: #0f766e; }

        .compare-pair { display: flex; gap: 10px; }
        .compare-col { flex: 1; min-width: 0; }
        .compare-col .json-block { font-size: 11px; }
        .compare-label {
            font-size: 11px; font-weight: bold; color: #475569;
            margin-bottom: 4px; padding-bottom: 3px;
            border-bottom: 1px solid #cbd5e1;
        }

        /* highlight wrappers */
        .hl {
            display: inline-block;
            padding: 1px 4px;
            margin: 0 -2px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: filter 0.15s, transform 0.15s, box-shadow 0.15s;
        }
        .hl:hover, .hl:focus { outline: none; filter: brightness(0.96); transform: translateY(-1px); }
        .hl.active { box-shadow: 0 0 0 2px #fbbf24; }
        .hl-id    { background: rgba(37, 99, 235, 0.18);  border-color: #2563eb; }
        .hl-type  { background: rgba(22, 163, 74, 0.18);  border-color: #16a34a; }
        .hl-reg   { background: rgba(234, 88, 12, 0.18);  border-color: #ea580c; }
        .hl-rev   { background: rgba(147, 51, 234, 0.18); border-color: #9333ea; }
        .hl-plat  { background: rgba(220, 38, 38, 0.18);  border-color: #dc2626; }

        /* compare-mode emphasis */
        .diff-changes {
            animation: pulse-changes 1.6s ease-in-out infinite;
        }
        .diff-stable {
            box-shadow: 0 0 0 2px #16a34a inset;
        }
        @keyframes pulse-changes {
            0%, 100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.0); }
            50%      { box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.5); }
        }

        .info-panel {
            flex: 1; background: #fff;
            padding: 14px; display: flex; flex-direction: column; overflow: hidden;
        }
        .color-bar {
            height: 6px; border-radius: 3px; margin-bottom: 10px; flex-shrink: 0;
        }
        .info-title {
            font-size: 15px; font-weight: bold; color: #1e293b;
            margin-bottom: 4px; flex-shrink: 0;
            font-family: 'SFMono-Regular', Consolas, monospace;
        }
        .info-question {
            font-size: 13px; color: #4338ca; font-style: italic;
            margin-bottom: 10px; padding-bottom: 6px;
            border-bottom: 1px dashed #cbd5e1; flex-shrink: 0;
        }
        .info-content {
            font-size: 12.5px; line-height: 1.55; color: #334155;
            overflow-y: auto; flex: 1;
        }
        .info-content p { margin-bottom: 8px; }
        .info-content code {
            background: #f1f5f9; padding: 1px 4px;
            border-radius: 3px; font-size: 11.5px; color: #be185d;
            font-family: 'SFMono-Regular', Consolas, monospace;
        }
        .legend {
            margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e1;
            font-size: 11px; color: #475569; flex-shrink: 0;
            display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px;
        }
        .legend .swatch {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 2px; vertical-align: middle; margin-right: 4px;
        }
    </style>
    <script src="activity-naming-and-occurrence-fields.js"></script>
</head>
<body>
<main>
    <div class="title">
        <span>Activity Naming and Occurrence Fields — hover or click any colored field</span>
        <span class="toggle-wrap">
            <input type="checkbox" id="compare-toggle">
            <label for="compare-toggle">Compare two attempts</label>
        </span>
    </div>
    <div class="container">
        <div class="json-panel">
            <div id="json-display"></div>
        </div>
        <div class="info-panel">
            <div id="info-display"></div>
            <div class="legend">
                <div><span class="swatch" style="background:#2563eb"></span>object.id — Which activity?</div>
                <div><span class="swatch" style="background:#16a34a"></span>definition.type — What kind?</div>
                <div><span class="swatch" style="background:#ea580c"></span>registration — Which attempt?</div>
                <div><span class="swatch" style="background:#9333ea"></span>revision — Which version?</div>
                <div><span class="swatch" style="background:#dc2626"></span>platform — Which host?</div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
