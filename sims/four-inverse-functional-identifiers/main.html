<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>The Four Inverse Functional Identifiers</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: Arial, Helvetica, sans-serif; background: #f8fafc;
        }
        .title-bar {
            height: 28px; line-height: 28px; padding: 0 14px;
            background: #1e293b; color: #fff; font-size: 13px; font-weight: bold;
            display: flex; align-items: center; justify-content: space-between;
        }
        .title-bar .subtitle {
            font-size: 11px; font-weight: normal; color: #cbd5e1;
        }
        .preset-bar {
            display: flex; gap: 8px; padding: 8px 12px;
            background: #f1f5f9; border-bottom: 1px solid #e2e8f0;
            align-items: center; flex-wrap: wrap;
        }
        .preset-label {
            font-size: 12px; color: #475569; font-weight: bold; margin-right: 4px;
        }
        .preset-btn {
            font-family: inherit; font-size: 12px; font-weight: 600;
            padding: 6px 12px; border-radius: 6px;
            background: #fff; color: #334155; border: 1px solid #cbd5e1;
            cursor: pointer; transition: all 0.15s ease;
        }
        .preset-btn:hover { background: #e0f2fe; border-color: #0284c7; }
        .preset-btn.active { background: #0d9488; color: #fff; border-color: #0d9488; }
        .container {
            display: flex; width: 100%;
            height: calc(100% - 28px - 41px);
        }
        main {
            width: 66%; min-width: 360px;
            background: #f8fafc; overflow: hidden;
            display: block; padding: 0; margin: 0;
        }
        .info-panel {
            flex: 1; background: #fff; border-left: 1px solid #e2e8f0;
            padding: 12px 14px; display: flex; flex-direction: column; overflow: hidden;
        }
        .info-panel h3 {
            font-size: 14px; color: #1e293b; margin-bottom: 8px;
            padding-bottom: 6px; border-bottom: 2px solid #0d9488; flex-shrink: 0;
        }
        .info-scroll { flex: 1; overflow-y: auto; padding-right: 4px; }
        .info-title { font-size: 16px; font-weight: bold; color: #0d9488; margin-bottom: 4px; font-family: 'Menlo', Consolas, monospace; }
        .info-badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 10px; font-weight: bold; margin-bottom: 10px; color: #fff;
            letter-spacing: 0.5px;
        }
        .info-content { font-size: 12px; line-height: 1.5; color: #334155; }
        .info-content p { margin-bottom: 8px; }
        .info-content code {
            background: #f1f5f9; padding: 1px 4px;
            border-radius: 3px; font-size: 11px; color: #be185d;
            font-family: 'Menlo', Consolas, monospace;
        }
        .info-content pre.worked {
            background: #0f172a; color: #e2e8f0; padding: 8px 10px;
            border-radius: 4px; font-size: 11px; font-family: 'Menlo', Consolas, monospace;
            white-space: pre-wrap; line-height: 1.4; margin-top: 4px;
        }
        .scenario-card {
            background: #ecfeff; border-left: 4px solid #0d9488;
            border-radius: 4px; padding: 8px 10px; margin-bottom: 12px;
        }
        .scenario-title {
            font-size: 12px; font-weight: bold; color: #0d9488; margin-bottom: 4px;
        }
        .scenario-body {
            font-size: 12px; line-height: 1.45; color: #334155;
        }
    </style>
    <script src="four-inverse-functional-identifiers.js"></script>
</head>
<body>
    <div class="title-bar">
        <span>The Four Inverse Functional Identifiers</span>
        <span class="subtitle">Click any card &middot; or pick a scenario</span>
    </div>
    <div class="preset-bar">
        <span class="preset-label">Scenario:</span>
        <button class="preset-btn" data-scenario="k12">K-12 Elementary</button>
        <button class="preset-btn" data-scenario="university">University LMS</button>
        <button class="preset-btn" data-scenario="corporate">Corporate L&amp;D</button>
    </div>
    <div class="container">
        <main></main>
        <div class="info-panel">
            <h3>IFI Details</h3>
            <div class="info-scroll">
                <div id="info-display">
                    <p style="color:#94a3b8; font-style:italic; font-size:12px;">Click a card on the left to see its full details, when-to-use guidance, and a worked agent example.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
