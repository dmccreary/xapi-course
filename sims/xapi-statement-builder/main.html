<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>xAPI Statement Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: Arial, Helvetica, sans-serif; background: #f8fafc;
            font-size: 13px; color: #334155;
        }
        .title-bar {
            height: 38px; line-height: 38px; padding: 0 14px;
            background: #1e293b; color: #fff; font-size: 14px; font-weight: bold;
        }
        .workspace {
            display: flex; width: 100%; height: calc(100% - 38px);
        }
        .ctrl-panel {
            width: 42%; min-width: 260px; background: #fff;
            border-right: 1px solid #dee2e6; overflow-y: auto; padding: 10px 12px;
        }
        .section { margin-bottom: 10px; }
        .section-hdr {
            font-size: 11px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.05em; color: #64748b; padding: 4px 0 5px;
            border-bottom: 1px solid #e2e8f0; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .field-row { margin-bottom: 6px; }
        .field-row label {
            display: block; font-size: 11px; color: #64748b; margin-bottom: 2px;
        }
        .field-row label .hint { color: #94a3b8; font-weight: normal; font-size: 10px; }
        .field-row select, .field-row input[type=text], .field-row input[type=number] {
            width: 100%; font-size: 12px; border: 1px solid #cbd5e1;
            border-radius: 4px; padding: 4px 7px; color: #334155; background: #fff;
        }
        .field-row input.err { border-color: #ef4444; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
        .checkbox-row input[type=checkbox] { width: 14px; height: 14px; }
        .toggle-btn {
            background: none; border: none; cursor: pointer;
            font-size: 11px; color: #4338ca; padding: 0; text-decoration: underline;
        }
        .collapsible { display: none; padding-top: 4px; }
        .collapsible.open { display: block; }
        .preview-panel {
            flex: 1; background: #0f172a; display: flex; flex-direction: column; overflow: hidden;
        }
        .preview-header {
            display: flex; align-items: center; gap: 8px; padding: 6px 12px;
            background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0;
        }
        .preview-header span { color: #94a3b8; font-size: 12px; }
        .status-pill {
            margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold;
        }
        .pill-idle    { background: #334155; color: #94a3b8; }
        .pill-valid   { background: #166534; color: #bbf7d0; }
        .pill-invalid { background: #7f1d1d; color: #fecaca; }
        .preview-code { flex: 1; overflow-y: auto; padding: 12px 14px; }
        .preview-code pre {
            font-family: 'Courier New', monospace; font-size: 12px;
            line-height: 1.65; color: #e2e8f0; white-space: pre-wrap; word-break: break-word;
        }
        .jk  { color: #93c5fd; }
        .js  { color: #86efac; }
        .jn  { color: #fbbf24; }
        .jb  { color: #f472b6; }
        .jnl { color: #94a3b8; }
        .bottom-bar {
            padding: 7px 12px; background: #1e293b; border-top: 1px solid #334155;
            display: flex; gap: 8px; align-items: center; flex-shrink: 0;
        }
        .issues-txt { color: #94a3b8; font-size: 11px; flex: 1; }
        .btn {
            font-size: 11px; padding: 5px 11px; border-radius: 4px;
            cursor: pointer; border: 1px solid;
        }
        .btn-p { background: #4338ca; color: #fff; border-color: #4338ca; }
        .btn-p:hover { background: #3730a3; }
        .btn-s { background: transparent; color: #94a3b8; border-color: #475569; }
        .btn-s:hover { color: #fff; border-color: #94a3b8; }
        .id-row { display: flex; gap: 5px; }
        .id-row input { flex: 1; font-family: monospace; font-size: 10px; }
        .id-row button { font-size: 10px; padding: 3px 7px; white-space: nowrap; }
    </style>
</head>
<body>
<main>
<div class="title-bar">xAPI Statement Builder — construct a conformant statement field by field</div>
<div class="workspace">

    <div class="ctrl-panel">

        <div class="section">
            <div class="section-hdr">
                <span>Actor <span style="color:#4338ca;font-weight:normal;text-transform:none">(required)</span></span>
            </div>
            <div class="field-row">
                <label>IFI Type <span class="hint">— how to identify the learner globally</span></label>
                <select id="ifi-type">
                    <option value="mbox">mbox (mailto: URI) — most common</option>
                    <option value="mbox_sha1sum">mbox_sha1sum — pseudonymous</option>
                    <option value="openid">openid — OpenID URI</option>
                    <option value="account">account — platform ID + name</option>
                </select>
            </div>
            <div class="field-row" id="row-mbox">
                <label>Email (mailto:…)</label>
                <input type="text" id="actor-mbox" value="mailto:learner@example.edu">
            </div>
            <div class="field-row" id="row-hash" style="display:none">
                <label>SHA-1 hash of mailto</label>
                <input type="text" id="actor-hash" placeholder="ebd31e95054c018b10727ccffd2ef2ec3a016ee9">
            </div>
            <div class="field-row" id="row-openid" style="display:none">
                <label>OpenID URI</label>
                <input type="text" id="actor-openid" placeholder="https://openid.example.edu/learner">
            </div>
            <div class="field-row" id="row-acct-hp" style="display:none">
                <label>Account homePage</label>
                <input type="text" id="actor-hp" placeholder="https://lms.example.edu">
            </div>
            <div class="field-row" id="row-acct-name" style="display:none">
                <label>Account name</label>
                <input type="text" id="actor-acct" placeholder="learner-42">
            </div>
            <div class="field-row">
                <label>Name <span class="hint">(display label, optional)</span></label>
                <input type="text" id="actor-name" placeholder="Lin Example">
            </div>
        </div>

        <div class="section">
            <div class="section-hdr">
                <span>Verb <span style="color:#4338ca;font-weight:normal;text-transform:none">(required)</span></span>
            </div>
            <div class="field-row">
                <label>ADL verb preset</label>
                <select id="verb-select">
                    <option value="">— enter custom IRI below —</option>
                    <option value="http://adlnet.gov/expapi/verbs/experienced" selected>experienced</option>
                    <option value="http://adlnet.gov/expapi/verbs/interacted">interacted</option>
                    <option value="http://adlnet.gov/expapi/verbs/attempted">attempted</option>
                    <option value="http://adlnet.gov/expapi/verbs/answered">answered</option>
                    <option value="http://adlnet.gov/expapi/verbs/passed">passed</option>
                    <option value="http://adlnet.gov/expapi/verbs/failed">failed</option>
                    <option value="http://adlnet.gov/expapi/verbs/completed">completed</option>
                    <option value="http://adlnet.gov/expapi/verbs/progressed">progressed</option>
                    <option value="http://adlnet.gov/expapi/verbs/mastered">mastered</option>
                    <option value="http://adlnet.gov/expapi/verbs/voided">voided</option>
                    <option value="http://adlnet.gov/expapi/verbs/initialized">initialized</option>
                    <option value="http://adlnet.gov/expapi/verbs/terminated">terminated</option>
                </select>
            </div>
            <div class="field-row" id="row-verb-custom" style="display:none">
                <label>Custom Verb IRI</label>
                <input type="text" id="verb-iri-custom" placeholder="https://example.com/verbs/reviewed">
            </div>
        </div>

        <div class="section">
            <div class="section-hdr">
                <span>Object <span style="color:#4338ca;font-weight:normal;text-transform:none">(required)</span></span>
            </div>
            <div class="field-row">
                <label>objectType</label>
                <select id="obj-type">
                    <option value="Activity">Activity (most common)</option>
                    <option value="Agent">Agent (another person)</option>
                    <option value="Group">Group (cohort)</option>
                    <option value="StatementRef">StatementRef (reference a statement)</option>
                </select>
            </div>
            <div class="field-row">
                <label>IRI / UUID</label>
                <input type="text" id="obj-id" value="http://textbook.example.org/chapters/02-statement-model">
            </div>
            <div class="field-row" id="row-act-name">
                <label>Activity name <span class="hint">(en-US display label)</span></label>
                <input type="text" id="obj-name" placeholder="Statement Model Chapter">
            </div>
        </div>

        <div class="section">
            <div class="section-hdr">
                <span>Result <span style="color:#0d9488;font-weight:normal;text-transform:none">(optional)</span></span>
                <button class="toggle-btn" onclick="toggleSection('result-body',this)">+ expand</button>
            </div>
            <div class="collapsible" id="result-body">
                <div class="checkbox-row">
                    <input type="checkbox" id="r-success"> <label for="r-success">success = true</label>
                    <input type="checkbox" id="r-fail" style="margin-left:10px"> <label for="r-fail">success = false</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="r-comp"> <label for="r-comp">completion = true</label>
                </div>
                <div class="field-row">
                    <label>score.scaled <span class="hint">(-1.0 to 1.0, e.g. 0.85)</span></label>
                    <input type="number" id="r-scaled" min="-1" max="1" step="0.01" placeholder="">
                </div>
                <div class="field-row">
                    <label>duration <span class="hint">(ISO 8601, e.g. PT5M30S)</span></label>
                    <input type="text" id="r-duration" placeholder="PT5M30S">
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-hdr">
                <span>Context <span style="color:#0d9488;font-weight:normal;text-transform:none">(optional)</span></span>
                <button class="toggle-btn" onclick="toggleSection('ctx-body',this)">+ expand</button>
            </div>
            <div class="collapsible" id="ctx-body">
                <div class="field-row">
                    <label>platform</label>
                    <input type="text" id="ctx-platform" placeholder="Intelligent xAPI Textbook">
                </div>
                <div class="field-row">
                    <label>language <span class="hint">(BCP 47)</span></label>
                    <input type="text" id="ctx-lang" placeholder="en-US">
                </div>
                <div class="field-row">
                    <label>parent activity IRI</label>
                    <input type="text" id="ctx-parent" placeholder="http://textbook.example.org/courses/xapi">
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-hdr"><span>Metadata</span></div>
            <div class="field-row">
                <label>id (UUID v4)</label>
                <div class="id-row">
                    <input type="text" id="stmt-id" readonly>
                    <button class="btn btn-s" id="regen-btn">New</button>
                </div>
            </div>
            <div class="field-row">
                <label>timestamp <span class="hint">(set to now on load)</span></label>
                <input type="text" id="stmt-ts" style="font-family:monospace;font-size:10px">
            </div>
        </div>

    </div><!-- end ctrl-panel -->

    <div class="preview-panel">
        <div class="preview-header">
            <span>Live JSON Preview</span>
            <span class="status-pill pill-idle" id="status-pill">Not validated</span>
        </div>
        <div class="preview-code">
            <pre id="json-out"></pre>
        </div>
        <div class="bottom-bar">
            <span class="issues-txt" id="issues-txt"></span>
            <button class="btn btn-p" id="validate-btn">Validate</button>
            <button class="btn btn-s" id="copy-btn">Copy JSON</button>
            <button class="btn btn-s" id="reset-btn">Reset</button>
        </div>
    </div>

</div>
</main>
<script src="xapi-statement-builder.js"></script>
</body>
</html>
