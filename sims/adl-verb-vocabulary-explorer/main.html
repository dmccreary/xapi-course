<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>ADL Verb Vocabulary Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f8fafc; font-family: Arial, Helvetica, sans-serif; }
        main { position: relative; width: 100%; }
        canvas { display: block; }
        select, input[type=text] {
            font-size: 12px; border: 1px solid #cbd5e1;
            border-radius: 4px; padding: 3px 7px;
            background: #fff; color: #334155;
        }
        .verb-infobox {
            position: absolute; right: 0; background: #fff;
            border-left: 2px solid #4338ca;
            padding: 12px 14px; overflow-y: auto;
            font-size: 12px; line-height: 1.55; color: #334155;
        }
        .verb-infobox .v-name {
            font-size: 17px; font-weight: bold; color: #1e293b; margin-bottom: 4px;
        }
        .verb-infobox .v-cat {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; color: #fff; margin-bottom: 8px;
        }
        .verb-infobox .v-iri {
            font-family: 'Courier New', monospace; font-size: 10px;
            background: #f1f5f9; padding: 5px 7px; border-radius: 3px;
            margin-bottom: 10px; word-break: break-all; color: #0369a1;
        }
        .verb-infobox .v-def { margin-bottom: 10px; }
        .verb-infobox .v-ex-label {
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.05em; color: #64748b; margin-bottom: 5px;
        }
        .verb-infobox .v-ex {
            background: #f8fafc; padding: 5px 8px; border-left: 3px solid #e2e8f0;
            border-radius: 0 3px 3px 0; margin-bottom: 5px; font-size: 12px;
        }
        .verb-infobox .v-placeholder { color: #94a3b8; font-style: italic; font-size: 13px; }
        .verb-copy-btn {
            position: absolute; font-size: 11px; padding: 5px 10px;
            border: 1px solid #4338ca; border-radius: 4px;
            cursor: pointer; background: #4338ca; color: #fff;
            display: none;
        }
        .verb-copy-btn:hover { background: #3730a3; }
    </style>
</head>
<body>
    <main></main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
    <script src="adl-verb-vocabulary-explorer.js"></script>
</body>
</html>
